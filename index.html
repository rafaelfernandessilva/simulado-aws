<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Simulado de arquitetura AWS em português com gabarito comentado.">
  <title>Simulado AWS · SAA-C03</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="questions.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="top"><div class="wrap bar"><a class="brand" href="./" aria-label="Estudo Simulado SAA, página inicial"><span aria-hidden="true">✦</span> Estudo Simulado SAA</a><span class="badge">AWS · SAA-C03</span></div></header>
  <main class="wrap">
    <section id="setup">
      <div class="hero">
        <div>
          <p class="eyebrow">PREPARAÇÃO PARA CERTIFICAÇÃO</p>
          <h1>Simulado AWS</h1>
          <p class="lead">Pratique questões para a certificação AWS SAA-C03 e revise o gabarito e as explicações ao finalizar.</p>
        </div>
        <div class="stat"><strong id="bank-size"></strong><span>questões em português</span></div>
      </div>
      <form class="panel" id="setup-form">
        <h2>Monte seu simulado</h2>
        <div class="fields">
          <div><label for="source-group">Conjunto de questões</label><select id="source-group"></select></div>
          <div><label for="domain">Domínio</label><select id="domain"></select></div>
          <div><label for="count">Quantidade de questões</label><input id="count" type="number" min="1" step="1" required aria-describedby="available"></div>
        </div>
        <div class="config"><span id="available" aria-live="polite"></span><div class="presets" id="presets" aria-label="Quantidades sugeridas"></div></div>
        <button class="primary" id="start-exam" type="submit">Iniciar simulado <span aria-hidden="true">→</span></button>
      </form>
      <div class="topics" id="topics" aria-label="Questões por domínio"></div>
    </section>
    <section id="exam" hidden></section>
    <section id="results" hidden></section>
  </main>
  <footer class="wrap">SAA-C03 <span aria-hidden="true">·</span> Material independente de estudo <span aria-hidden="true">·</span> <a href="https://blog.rafael.bhz.br/">Blog do Rafael</a></footer>
</body>
</html>
